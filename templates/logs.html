{% extends 'base.html' %}

{% block content %}

<h2>System Logs</h2>

<table class="table table-sm">

  <thead>
    <tr>
      <th>Time</th>
      <th>User</th>
      <th>Action</th>
      <th>Entity</th>
      <th>ID</th>
      <th>Detail</th>
    </tr>
  </thead>

  <tbody>

    {% for l in logs %}

    <tr>
      <td>{{ l.created_at }}</td>

      <td>
        {{ l.username or '-' }}
      </td>

      <td>{{ l.action }}</td>

      <td>{{ l.entity }}</td>

      <td>
        {{ l.entity_id or '-' }}
      </td>

      <td>{{ l.detail }}</td>
    </tr>

    {% endfor %}

  </tbody>

</table>

{% endblock %}
