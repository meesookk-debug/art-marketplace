{% extends 'base.html' %}

{% block content %}

<div class="form-box">

  <h2>Staff / Admin Access</h2>

  <p class="text-muted">
    Enter the access key to continue.
  </p>

  <form method="post">

    <label>Access Key</label>

    <input
      class="form-control mb-3"
      type="password"
      name="access_key"
      placeholder="Enter access key"
      required
      autocomplete="off"
    >

    <button class="btn btn-primary w-100">
      Continue
    </button>

  </form>

  <p class="mt-3 small text-muted">
    This area is restricted to authorized staff and administrators.
  </p>

</div>

{% endblock %}
